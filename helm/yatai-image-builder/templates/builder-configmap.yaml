apiVersion: v1
kind: ConfigMap
immutable: false
metadata:
  name: yatai-image-builder-config
  namespace: {{ .Release.Namespace }}
data:
  default_image_builder_container_resources: |
    requests:
      {{- .Values.builder.requests | toYaml | nindent 6 }}
    limits:
      {{- .Values.builder.limits | toYaml | nindent 6 }}
  extra_pod_spec: |
    nodeSelector:
      {{- .Values.builder.nodeSelector | toYaml | nindent 6 }}
    tolerations:
      {{- .Values.builder.tolerations | toYaml | nindent 6 }}
    affinity:
      {{- .Values.builder.affinity | toYaml | nindent 6 }}
  {{- if or .Values.proxy.httpProxy .Values.proxy.httpsProxy .Values.proxy.noProxy }}
  extra_container_env: |
    {{- if .Values.proxy.httpProxy }}
    - name: HTTP_PROXY
      value: {{ .Values.proxy.httpProxy | quote }}
    {{- end }}
    {{- if .Values.proxy.httpsProxy }}
    - name: HTTPS_PROXY
      value: {{ .Values.proxy.httpsProxy | quote }}
    {{- end }}
    {{- if .Values.proxy.noProxy }}
    - name: NO_PROXY
      value: {{ .Values.proxy.noProxy | quote }}
    {{- end }}
  {{- end }}
